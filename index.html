<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fdf6f0" />
  <title>Period Tracker</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=zodiak@700&display=swap" />
  <style>
    :root {
      --color-bg:#fdf6f0; --color-surface:#fff9f5; --color-surface-2:#fff3ec;
      --color-border:rgba(180,100,80,0.12); --color-text:#2d1a14;
      --color-text-muted:#8a6055; --color-text-faint:#c4a89a;
      --color-primary:#c94040; --color-primary-hover:#a82e2e;
      --color-fertile:#2a9d8f; --color-ovulation:#7b5ea7;
      --color-tab-active:#c94040; --color-danger:#b53030; --color-success:#2a9d5c;
      --color-partner:#1a6fa8;

      --tint-period:#fce8e8; --tint-period-pred:#fce0e0;
      --tint-fertile:#e0f4f2; --tint-ovulation:#ede6f7;
      --tint-primary-bg:#fceaea; --tint-primary-border:#e8a0a0;
      --tint-fertile-bg:#e0f4f2; --tint-fertile-border:#88cdc7;
      --tint-ovulation-bg:#ede6f7; --tint-ovulation-border:#b8a0d0;
      --tint-danger-bg:#fce8e8; --tint-danger-border:#e8a0a0;
      --tint-success-bg:#e6f7ed; --tint-success-border:#88c8a0;
      --tint-partner-bg:#e6f0f8; --tint-partner-border:#88b8d8;

      --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;
      --space-5:20px;--space-6:24px;--space-7:28px;--space-8:32px;
      --radius-sm:6px;--radius-md:12px;--radius-lg:20px;--radius-full:9999px;
      --shadow-sm:0 2px 12px rgba(0,0,0,0.06);
      --header-h:56px;--nav-h:60px;--max-w:393px;
      --font-body:'Satoshi',system-ui,-apple-system,sans-serif;
      --font-display:'Zodiak',Georgia,serif;
      --text-xs:clamp(0.75rem,0.72rem + 0.12vw,0.78rem);
      --text-sm:clamp(0.875rem,0.84rem + 0.2vw,0.95rem);
      --text-base:clamp(1rem,0.96rem + 0.25vw,1.05rem);
      --text-lg:clamp(1.125rem,1.02rem + 0.45vw,1.3rem);
      --text-xl:clamp(1.35rem,1.2rem + 0.8vw,1.7rem);
      --text-2xl:clamp(1.7rem,1.5rem + 1vw,2.2rem);
    }
    [data-theme="dark"] {
      --color-bg:#1a1010;--color-surface:#201414;--color-surface-2:#261818;
      --color-border:rgba(255,180,160,0.10);--color-text:#f5e8e0;
      --color-text-muted:#b08070;--color-text-faint:#6a4a40;
      --color-primary:#e06060;--color-primary-hover:#c94040;
      --color-fertile:#4db6aa;--color-ovulation:#a688d0;
      --color-tab-active:#e06060;--color-partner:#4a9ed0;
      --shadow-sm:0 2px 12px rgba(0,0,0,0.28);
      --tint-period:#3a1a1a;--tint-period-pred:#3a1a1a;
      --tint-fertile:#1a3230;--tint-ovulation:#2a2040;
      --tint-primary-bg:#3a1a1a;--tint-primary-border:#7a3030;
      --tint-fertile-bg:#1a3230;--tint-fertile-border:#3a8078;
      --tint-ovulation-bg:#2a2040;--tint-ovulation-border:#6a50a0;
      --tint-danger-bg:#3a1010;--tint-danger-border:#8a2020;
      --tint-success-bg:#0a2a18;--tint-success-border:#207040;
      --tint-partner-bg:#0a2040;--tint-partner-border:#2a5878;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;height:100%;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);}
    body{min-height:100dvh;overflow:hidden;}
    button,input,textarea,select{font:inherit;color:inherit;}
    button{border:none;background:none;cursor:pointer;min-height:44px;min-width:44px;}
    button:active,.chip:active,.select-pill:active,.nav-item:active,.day-cell:active,.icon-btn:active{transform:scale(0.97);}
    :focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;}
    .app{width:100%;max-width:var(--max-w);margin:0 auto;min-height:100dvh;position:relative;background:var(--color-bg);}
    .topbar{height:calc(var(--header-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) var(--space-4) 0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:rgba(253,246,240,0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--color-border);}
    [data-theme="dark"] .topbar{background:rgba(26,16,16,0.92);}
    .brand{display:flex;align-items:center;gap:var(--space-3);}
    .brand-mark{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--color-primary),#f07b7b);display:grid;place-items:center;color:white;box-shadow:var(--shadow-sm);}
    .brand h1{margin:0;font-family:var(--font-display);font-size:var(--text-lg);line-height:1;}
    .icon-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-full);background:var(--color-surface);border:1px solid var(--color-border);box-shadow:var(--shadow-sm);padding:0 10px;}
    .main{height:calc(100dvh - var(--header-h) - env(safe-area-inset-top) - var(--nav-h) - env(safe-area-inset-bottom));overflow-y:auto;padding:0;position:relative;}
    .view{position:absolute;top:0;left:0;right:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 180ms ease;padding:var(--space-4);padding-bottom:var(--space-8);}
    .view.active{opacity:1;visibility:visible;pointer-events:auto;position:relative;}
    .view h1{margin:0 0 var(--space-2);font-family:var(--font-display);font-size:var(--text-2xl);line-height:1.1;}
    .subtle{color:var(--color-text-muted);font-size:var(--text-sm);}
    .stack{display:grid;gap:var(--space-4);}
    .card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-4);}
    p,h1,h2,h3,.subtle,.timeline-sub,.action-card p,.research-note,.timeline-title,.stat-value,.status-line{overflow-wrap:break-word;word-break:break-word;hyphens:auto;} .card h2{margin:0 0 var(--space-2);font-size:var(--text-base);}
    .hero-card{background:linear-gradient(180deg,var(--color-surface) 0%,var(--color-surface-2) 100%);}
    .partner-hero{background:linear-gradient(135deg,var(--tint-partner-bg),var(--color-surface-2));}
    .status-line{font-size:var(--text-xl);font-weight:700;line-height:1.15;margin:var(--space-2) 0 var(--space-3);}
    .muted{color:var(--color-text-muted);}
    .primary-btn,.secondary-btn,.danger-btn,.success-btn,.partner-btn{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);border-radius:16px;padding:14px 16px;font-weight:700;transition:transform 120ms ease,background 120ms ease;}
    .primary-btn{background:var(--color-primary);color:#fff;box-shadow:var(--shadow-sm);}
    .primary-btn:hover{background:var(--color-primary-hover);}
    .secondary-btn{background:var(--color-surface-2);border:1px solid var(--color-border);}
    .danger-btn{background:var(--tint-danger-bg);border:1px solid var(--tint-danger-border);color:var(--color-danger);}
    .success-btn{background:var(--tint-success-bg);border:1px solid var(--tint-success-border);color:var(--color-success);}
    .partner-btn{background:var(--color-partner);color:#fff;box-shadow:var(--shadow-sm);}
    .chip-row,.symptom-grid,.select-row{display:flex;flex-wrap:wrap;gap:var(--space-2);}
    .chip,.select-pill{min-height:40px;padding:10px 14px;border-radius:var(--radius-full);background:var(--color-surface-2);border:1px solid var(--color-border);color:var(--color-text);font-size:var(--text-sm);display:inline-flex;align-items:center;justify-content:center;transition:transform 120ms ease,background 120ms ease,color 120ms ease,border-color 120ms ease;}
    .chip.active,.select-pill.active{background:var(--tint-primary-bg);border-color:var(--tint-primary-border);color:var(--color-primary);font-weight:700;}
    .chip.fertile-chip.active{background:var(--tint-fertile-bg);border-color:var(--tint-fertile-border);color:var(--color-fertile);}
    .chip.ovulation-chip.active{background:var(--tint-ovulation-bg);border-color:var(--tint-ovulation-border);color:var(--color-ovulation);}
    .chip.partner-chip.active{background:var(--tint-partner-bg);border-color:var(--tint-partner-border);color:var(--color-partner);}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);}
    .three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-3);}
    .stat{padding:var(--space-3);border-radius:var(--radius-md);background:var(--color-surface-2);border:1px solid var(--color-border);}
    .stat-label{font-size:var(--text-xs);color:var(--color-text-muted);margin-bottom:var(--space-1);}
    .stat-value{font-size:var(--text-lg);font-weight:700;}
    .mini-list{display:grid;gap:var(--space-2);}
    .mini-item{padding:var(--space-3);border-radius:var(--radius-md);background:var(--color-surface-2);border:1px solid var(--color-border);display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);width:100%;text-align:left;}
    .empty-state{text-align:center;padding:var(--space-5);display:grid;gap:var(--space-3);place-items:center;}
    .empty-illustration{width:160px;height:120px;color:var(--color-text-faint);}
    .calendar-shell{display:grid;gap:var(--space-3);}
    .calendar-header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);}
    .month-title{font-family:var(--font-display);font-size:var(--text-lg);margin:0;}
    .weekday-row,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--space-2);}
    .weekday{text-align:center;font-size:var(--text-xs);color:var(--color-text-muted);padding:var(--space-2) 0;}
    .day-cell{aspect-ratio:1/1;border-radius:12px;border:1px solid var(--color-border);background:var(--color-surface);display:flex;align-items:center;justify-content:center;position:relative;font-size:var(--text-sm);transition:transform 120ms ease;}
    .day-cell.outside{color:var(--color-text-faint);background:var(--color-bg);}
    .day-cell.today{box-shadow:inset 0 0 0 2px var(--color-primary);}
    .day-cell.logged-period{background:var(--tint-period);color:var(--color-primary);font-weight:700;}
    .day-cell.pred-period{background:var(--tint-period-pred);}
    .day-cell.fertile{background:var(--tint-fertile);color:var(--color-fertile);}
    .ovulation-dot,.legend-dot{width:7px;height:7px;border-radius:50%;position:absolute;bottom:5px;left:50%;transform:translateX(-50%);background:var(--color-ovulation);}
    .legend{display:flex;flex-wrap:wrap;gap:var(--space-3);font-size:var(--text-xs);color:var(--color-text-muted);}
    .legend-item{display:inline-flex;align-items:center;gap:var(--space-2);}
    .legend-swatch{width:14px;height:14px;border-radius:4px;border:1px solid var(--color-border);background:var(--color-surface-2);position:relative;flex:0 0 auto;}
    .swatch-period{background:var(--tint-period);}
    .swatch-pred{background:var(--tint-period-pred);}
    .swatch-fertile{background:var(--tint-fertile);}
    .swatch-today{box-shadow:inset 0 0 0 2px var(--color-primary);background:transparent;}
    .field{display:grid;gap:var(--space-2);}
    .field label{font-size:var(--text-sm);font-weight:700;}
    input[type="date"],textarea{width:100%;border-radius:14px;border:1px solid var(--color-border);background:var(--color-surface-2);padding:12px 14px;color:var(--color-text);min-height:48px;-webkit-appearance:none;}
    textarea{min-height:110px;resize:vertical;}
    .range-wrap{display:grid;gap:var(--space-2);}
    input[type="range"]{width:100%;accent-color:var(--color-primary);}
    .range-value{font-weight:700;color:var(--color-primary);}
    .bar-list{display:grid;gap:var(--space-3);}
    .bar-row{display:grid;gap:6px;}
    .bar-meta{display:flex;justify-content:space-between;gap:var(--space-2);font-size:var(--text-sm);}
    .bar-track{width:100%;height:12px;border-radius:var(--radius-full);background:var(--color-surface-2);overflow:hidden;border:1px solid var(--color-border);}
    .bar-fill{height:100%;border-radius:var(--radius-full);background:linear-gradient(90deg,var(--color-primary),#ef8b8b);}
    .mood-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-2);}
    .mood-box{text-align:center;padding:var(--space-3);border-radius:var(--radius-md);background:var(--color-surface-2);border:1px solid var(--color-border);display:grid;gap:4px;}
    .mood-emoji{font-size:22px;line-height:1;}

    /* Partner-specific */
    .phase-badge{display:inline-flex;align-items:center;gap:var(--space-2);padding:6px 14px;border-radius:var(--radius-full);font-weight:700;font-size:var(--text-sm);}
    .phase-period{background:var(--tint-period);color:var(--color-primary);}
    .phase-follicular{background:var(--color-surface-2);color:var(--color-text-muted);}
    .phase-fertile{background:var(--tint-fertile-bg);color:var(--color-fertile);}
    .phase-ovulation{background:var(--tint-ovulation-bg);color:var(--color-ovulation);}
    .phase-luteal{background:var(--color-surface-2);color:var(--color-text-muted);}

    .action-card{border-radius:var(--radius-lg);padding:var(--space-4);border:1px solid var(--color-border);}
    .action-card.green{background:var(--tint-success-bg);border-color:var(--tint-success-border);}
    .action-card.blue{background:var(--tint-partner-bg);border-color:var(--tint-partner-border);}
    .action-card.amber{background:#fdf6e0;border-color:#e8d080;}
    [data-theme="dark"] .action-card.amber{background:#2a2010;border-color:#6a5820;}
    .action-card.red{background:var(--tint-period);border-color:var(--tint-primary-border);}
    .action-card h3{margin:0 0 var(--space-2);font-size:var(--text-base);}
    .action-card p{margin:0;font-size:var(--text-sm);line-height:1.6;color:var(--color-text-muted);}
    .action-card strong{color:var(--color-text);}

    .timeline{display:grid;gap:0;}
    .timeline-item{display:flex;gap:var(--space-3);padding:var(--space-3) 0;position:relative;}
    .timeline-item:not(:last-child)::after{content:'';position:absolute;left:19px;top:44px;bottom:0;width:2px;background:var(--color-border);}
    .timeline-dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:0 0 40px;font-size:18px;background:var(--color-surface-2);border:1px solid var(--color-border);}
    .timeline-dot.active-dot{background:var(--tint-fertile-bg);border-color:var(--tint-fertile-border);}
    .timeline-dot.today-dot{background:var(--tint-ovulation-bg);border-color:var(--tint-ovulation-border);}
    .timeline-content{flex:1;padding-top:6px;}
    .timeline-title{font-weight:700;font-size:var(--text-sm);}
    .timeline-sub{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:2px;line-height:1.4;}

    .research-note{font-size:var(--text-xs);color:var(--color-text-faint);font-style:italic;line-height:1.5;}

    .nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:var(--max-w);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:0 var(--space-1) env(safe-area-inset-bottom);background:rgba(255,249,245,0.95);backdrop-filter:blur(18px);border-top:1px solid var(--color-border);z-index:30;}
    [data-theme="dark"] .nav{background:rgba(32,20,20,0.95);}
    .nav-inner{height:var(--nav-h);display:grid;grid-template-columns:repeat(6,1fr);align-items:stretch;}
    .nav-item{display:grid;place-items:center;gap:2px;color:var(--color-text-muted);border-radius:12px;margin:4px 1px;min-width:0;}
    .nav-item.active{color:var(--color-tab-active);background:var(--tint-primary-bg);font-weight:700;}
    .nav-item[data-tab="partner"].active{color:var(--color-partner);background:var(--tint-partner-bg);}
    .nav-item span{font-size:9px;line-height:1;}

    .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.35);opacity:0;pointer-events:none;transition:opacity 200ms ease;z-index:40;}
    .sheet-backdrop.open{opacity:1;pointer-events:auto;}
    .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:var(--max-w);max-height:82vh;background:var(--color-surface);border-radius:24px 24px 0 0;border:1px solid var(--color-border);box-shadow:0 -8px 24px rgba(0,0,0,0.18);transition:transform 220ms ease;z-index:50;overflow:hidden;}
    .sheet.open{transform:translate(-50%,0);}
    .sheet-handle{width:42px;height:5px;border-radius:var(--radius-full);background:var(--color-border);position:absolute;top:8px;left:50%;transform:translateX(-50%);}
    .sheet-header{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;background:var(--color-surface);position:sticky;top:0;z-index:1;}
    .sheet-body{padding:var(--space-4);overflow-y:auto;max-height:calc(82vh - 70px);display:grid;gap:var(--space-4);}

    .wizard{min-height:100vh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 24px) var(--space-4) calc(env(safe-area-inset-bottom) + 24px);}
    .wizard-card{width:100%;background:var(--color-surface);border:1px solid var(--color-border);border-radius:28px;padding:var(--space-5);box-shadow:var(--shadow-sm);display:grid;gap:var(--space-4);}
    .wizard-step-label{color:var(--color-text-muted);font-size:var(--text-sm);font-weight:700;}
    .progress{width:100%;height:8px;border-radius:var(--radius-full);background:var(--color-surface-2);overflow:hidden;border:1px solid var(--color-border);}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--color-primary),#ef8b8b);border-radius:var(--radius-full);transition:width 200ms ease;}
    .inline-actions{display:flex;gap:var(--space-3);}
    .inline-actions>*{flex:1;}

    .settings-section{display:grid;gap:var(--space-2);}
    .settings-label{font-size:var(--text-xs);font-weight:700;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.08em;padding:var(--space-2) var(--space-1) 0;}
    .settings-row{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);background:var(--color-surface);border:1px solid var(--color-border);gap:var(--space-3);min-height:56px;}
    .settings-row-label{font-weight:700;font-size:var(--text-sm);}
    .settings-row-sub{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:2px;}
    .settings-action-btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:10px 16px;border-radius:12px;font-weight:700;font-size:var(--text-sm);min-height:40px;white-space:nowrap;}

    .toast{position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);left:50%;transform:translateX(-50%) translateY(12px);background:var(--color-text);color:var(--color-bg);padding:10px 20px;border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:700;opacity:0;transition:opacity 200ms ease,transform 200ms ease;z-index:100;pointer-events:none;white-space:nowrap;max-width:calc(var(--max-w) - 32px);}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .hidden{display:none!important;}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
  </style>
</head>
<body>

  <div id="onboarding" class="wizard hidden">
    <section class="wizard-card">
      <div class="progress"><div class="progress-fill" id="wizProg" style="width:33%"></div></div>
      <div class="wizard-step-label" id="wizStepLabel">Step 1 of 3</div>
      <h1 id="wizTitle" style="font-family:var(--font-display);font-size:var(--text-xl);margin:0;">When did your last period start?</h1>
      <p class="subtle" id="wizDesc">We'll use this to show your current cycle right away.</p>
      <div id="wizS1" class="field">
        abel for="wizDate">Last period start date</label>
        <input id="wizDate" type="date" />
      </div>
      <div id="wizS2" class="field hidden">
        abel for="wizCycle">Typical cycle length</label>
        <div class="range-wrap">
          <input id="wizCycle" type="range" min="21" max="45" value="28" />
          <div><span class="range-value" id="wizCycleVal">28</span> days</div>
        </div>
      </div>
      <div id="wizS3" class="field hidden">
        abel for="wizPeriod">Typical period length</label>
        <div class="range-wrap">
          <input id="wizPeriod" type="range" min="2" max="10" value="5" />
          <div><span class="range-value" id="wizPeriodVal">5</span> days</div>
        </div>
      </div>
      <div class="inline-actions">
        <button id="wizBack" class="secondary-btn hidden" type="button">Back</button>
        <button id="wizNext" class="primary-btn" type="button">Continue</button>
      </div>
    </section>
  </div>

  <div class="app hidden" id="appRoot">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><i data-lucide="heart"></i></div>
        <h1>Period Tracker</h1>
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode"><i data-lucide="moon"></i></button>
    </header>
    <main class="main" id="mainContent">
      <section id="view-home"     class="view active"></section>
      <section id="view-calendar" class="view"></section>
      <section id="view-log"      class="view"></section>
      <section id="view-insights" class="view"></section>
      <section id="view-partner"  class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>
    <nav class="nav" aria-label="Bottom navigation">
      <div class="nav-inner">
        <button class="nav-item active" data-tab="home"     aria-label="Home"><i data-lucide="house"></i><span>Home</span></button>
        <button class="nav-item"        data-tab="calendar" aria-label="Calendar"><i data-lucide="calendar-days"></i><span>Calendar</span></button>
        <button class="nav-item"        data-tab="log"      aria-label="Log"><i data-lucide="notebook-pen"></i><span>Log</span></button>
        <button class="nav-item"        data-tab="insights" aria-label="Insights"><i data-lucide="chart-column"></i><span>Insights</span></button>
        <button class="nav-item"        data-tab="partner"  aria-label="Partner"><i data-lucide="users"></i><span>Partner</span></button>
        <button class="nav-item"        data-tab="settings" aria-label="Settings"><i data-lucide="settings-2"></i><span>More</span></button>
      </div>
    </nav>
  </div>

  <div id="sheetBackdrop" class="sheet-backdrop"></div>
  <aside id="daySheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-header">
      <div>
        <div class="subtle">Day details</div>
        <h2 id="sheetTitle" style="margin:4px 0 0;font-family:var(--font-display);font-size:var(--text-lg);">Log day</h2>
      </div>
      <button class="icon-btn" id="sheetClose" aria-label="Close"><i data-lucide="x"></i></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </aside>

  <input type="file" id="importInput" accept=".json,application/json" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;" aria-hidden="true" />
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
  (function() {
    'use strict';
    const KEYS = { logs:'pt_logs', settings:'pt_settings', theme:'pt_theme' };
    const SYMPTOMS = [['cramps','Cramps'],['bloating','Bloating'],['headache','Headache'],['fatigue','Fatigue'],['tender-breasts','Tender breasts'],['acne','Acne'],['mood-swings','Mood swings'],['nausea','Nausea'],['back-pain','Back pain']];
    const MOODS = [['happy','😊 Happy'],['neutral','😐 Neutral'],['sad','😔 Sad'],['irritable','😠 Irritable'],['anxious','😰 Anxious']];
    const ENERGIES = [['low','Low'],['medium','Medium'],['high','High']];

    const S = { tab:'home', selectedDate:isoToday(), calMonth:monthStart(new Date()), wizStep:1, logs:[], settings:{cycleLength:28,periodLength:5,setupComplete:false}, theme:'light' };

    /* ── Date helpers (pure) ── */
    function isoToday(){const n=new Date();return `${n.getFullYear()}-${p2(n.getMonth()+1)}-${p2(n.getDate())}`;}
    function p2(n){return String(n).padStart(2,'0');}
    function toISO(d){return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
    function fromISO(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12,0,0);}
    function monthStart(d){return new Date(d.getFullYear(),d.getMonth(),1,12,0,0);}
    function addDays(di,n){const d=typeof di==='string'?fromISO(di):new Date(di.getTime());d.setDate(d.getDate()+n);return d;}
    function diffDays(a,b){const da=typeof a==='string'?fromISO(a):new Date(a.getTime());const db=typeof b==='string'?fromISO(b):new Date(b.getTime());da.setHours(12,0,0,0);db.setHours(12,0,0,0);return Math.round((db-da)/86400000);}
    function fmtLong(d){const dt=typeof d==='string'?fromISO(d):d;return new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(dt);}
    function fmtMonthYear(d){const dt=typeof d==='string'?fromISO(d):d;return new Intl.DateTimeFormat(undefined,{month:'long',year:'numeric'}).format(dt);}
    function fmtShort(d){const dt=typeof d==='string'?fromISO(d):d;return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(dt);}
    function fmtWeekday(d){const dt=typeof d==='string'?fromISO(d):d;return new Intl.DateTimeFormat(undefined,{weekday:'long',month:'short',day:'numeric'}).format(dt);}

    /* ── Storage ── */
    function loadState(){try{const l=localStorage.getItem(KEYS.logs);const sv=localStorage.getItem(KEYS.settings);const t=localStorage.getItem(KEYS.theme);S.logs=l?normalizeLogs(JSON.parse(l)):[];if(sv){const p=JSON.parse(sv);S.settings={cycleLength:clamp(p.cycleLength,21,45,28),periodLength:clamp(p.periodLength,2,10,5),setupComplete:Boolean(p.setupComplete)};}S.theme=t==='dark'?'dark':'light';}catch(e){S.logs=[];}}
    function persist(){localStorage.setItem(KEYS.logs,JSON.stringify(S.logs));localStorage.setItem(KEYS.settings,JSON.stringify(S.settings));localStorage.setItem(KEYS.theme,S.theme);}
    function normalizeLogs(arr){if(!Array.isArray(arr))return[];const map=new Map();arr.forEach(log=>{if(!log||!log.date||typeof log.date!=='string')return;map.set(log.date,{date:log.date,isPeriod:Boolean(log.isPeriod),flow:['none','spotting','light','medium','heavy'].includes(log.flow)?log.flow:'none',symptoms:Array.isArray(log.symptoms)?[...new Set(log.symptoms)]:[],mood:['happy','neutral','sad','irritable','anxious'].includes(log.mood)?log.mood:'',energy:['low','medium','high'].includes(log.energy)?log.energy:'',note:typeof log.note==='string'?log.note.slice(0,280):''});});return[...map.values()].sort((a,b)=>a.date.localeCompare(b.date));}
    function clamp(v,mn,mx,fb){const n=Number(v);return isNaN(n)?fb:Math.min(mx,Math.max(mn,n));}

    /* ── Log ops ── */
    function getLog(date){return S.logs.find(l=>l.date===date)||null;}
    function saveLog(date,partial){const base=getLog(date)||{date,isPeriod:false,flow:'none',symptoms:[],mood:'',energy:'',note:''};const next=Object.assign({},base,partial);if(Array.isArray(partial.symptoms))next.symptoms=[...new Set(partial.symptoms)];if(typeof partial.note==='string')next.note=partial.note.slice(0,280);const empty=!next.isPeriod&&next.flow==='none'&&next.symptoms.length===0&&!next.mood&&!next.energy&&!next.note;if(empty){S.logs=S.logs.filter(l=>l.date!==date);}else{const idx=S.logs.findIndex(l=>l.date===date);if(idx>=0)S.logs[idx]=next;else S.logs.push(next);S.logs=normalizeLogs(S.logs);}persist();renderAll();showToast('Saved ✓');}
    function quickLog(){const date=isoToday();const ex=getLog(date);saveLog(date,{isPeriod:true,flow:ex?.flow&&ex.flow!=='none'?ex.flow:'medium'});}

    /* ── Predictions ── */
    function getPeriods(){const pl=S.logs.filter(l=>l.isPeriod).sort((a,b)=>a.date.localeCompare(b.date));const out=[];let cur=null;pl.forEach(log=>{if(!cur){cur={start:log.date,end:log.date};return;}if(diffDays(cur.end,log.date)<=1){cur.end=log.date;}else{out.push(cur);cur={start:log.date,end:log.date};}});if(cur)out.push(cur);return out;}

    function calcPredictions(){
      const periods=getPeriods();const starts=periods.map(p=>p.start);
      const gaps=[];for(let i=1;i<starts.length;i++)gaps.push(diffDays(starts[i-1],starts[i]));
      const rg=gaps.slice(-6);const avgCycle=rg.length?Math.round(rg.reduce((a,b)=>a+b,0)/rg.length):S.settings.cycleLength;
      const durations=periods.map(p=>diffDays(p.start,p.end)+1);const rd=durations.slice(-6);
      const avgPeriod=rd.length?Math.round(rd.reduce((a,b)=>a+b,0)/rd.length):S.settings.periodLength;
      const lastStart=starts.length?starts[starts.length-1]:isoToday();
      const nextStart=toISO(addDays(lastStart,avgCycle));
      const fertileStart=toISO(addDays(nextStart,-18));
      const fertileEnd=toISO(addDays(nextStart,-11));
      const ovuDay=toISO(addDays(nextStart,-14));
      // Clearance day = 2–4 days before fertile window opens
      const clearanceDay=toISO(addDays(fertileStart,-2));
      const nextThree=[];let cursor=fromISO(nextStart);for(let i=0;i<3;i++){nextThree.push(toISO(cursor));cursor=addDays(cursor,avgCycle);}
      const sample=gaps.slice(-6);let regularity='Not enough data yet';
      if(sample.length>=2){const avg=sample.reduce((a,b)=>a+b,0)/sample.length;const sd=Math.sqrt(sample.reduce((s,v)=>s+Math.pow(v-avg,2),0)/sample.length);regularity=sd<=2?'Regular ✓':sd<=5?'Slightly irregular':'Irregular';}
      const today=isoToday();const currentPeriod=periods.find(p=>today>=p.start&&today<=p.end);
      // Determine current cycle phase
      let phase='follicular';
      if(currentPeriod)phase='period';
      else if(today>=fertileStart&&today<ovuDay)phase='fertile';
      else if(today===ovuDay)phase='ovulation';
      else if(today>ovuDay&&today<nextStart)phase='luteal';
      return{periods,starts,gaps,avgCycle,avgPeriod,regularity,lastStart,nextStart,fertileStart,fertileEnd,ovuDay,clearanceDay,nextThree,currentPeriod,phase};
    }

    function buildPredMap(pred){const map=new Map();pred.nextThree.forEach(start=>{for(let i=0;i<pred.avgPeriod;i++){const iso=toISO(addDays(start,i));map.set(iso,Object.assign({},map.get(iso)||{},{predPeriod:true}));}for(let i=0;i<=7;i++){const iso=toISO(addDays(start,-18+i));map.set(iso,Object.assign({},map.get(iso)||{},{fertile:true}));}const ovu=toISO(addDays(start,-14));map.set(ovu,Object.assign({},map.get(ovu)||{},{ovulation:true}));});return map;}

    function statusCopy(pred){const today=isoToday();if(pred.currentPeriod){const day=diffDays(pred.currentPeriod.start,today)+1;return{headline:`Day ${day} of your period — hang in there 💛`,sub:`Started ${fmtShort(pred.currentPeriod.start)}.`,tag:`Day ${day} of current period`};}const tlog=getLog(today);if(tlog?.isPeriod)return{headline:'Your period likely started today 💛',sub:'You logged today as a period day.',tag:'Period today'};if(today>=pred.fertileStart&&today<=pred.fertileEnd){const day=diffDays(pred.lastStart,today)+1;return{headline:"You're likely fertile right now 🌿",sub:`Ovulation predicted around ${fmtShort(pred.ovuDay)}.`,tag:`Day ${day} of cycle`};}const dtp=diffDays(today,pred.nextStart);const day=diffDays(pred.lastStart,today)+1;if(dtp<=0)return{headline:'Your period is likely today ✨',sub:'Based on your recent cycle.',tag:`Day ${day} of cycle`};return{headline:`Your period is due in ${dtp} day${dtp===1?'':'s'} ✨`,sub:`Next predicted start: ${fmtShort(pred.nextStart)}.`,tag:`Day ${day} of cycle`};}

    /* ── Export / Import ── */
    function exportData(){const payload=JSON.stringify({exportedAt:new Date().toISOString(),appVersion:'1.2',pt_logs:S.logs,pt_settings:S.settings},null,2);const filename=`period-tracker-${isoToday()}.json`;try{const blob=new Blob([payload],{type:'application/octet-stream'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.style.cssText='position:absolute;opacity:0;';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);document.body.removeChild(a);},500);showToast('Backup exported ✓');}catch(e){const a=document.createElement('a');a.href='data:application/octet-stream,'+encodeURIComponent(payload);a.download=filename;a.style.cssText='position:absolute;opacity:0;';document.body.appendChild(a);a.click();document.body.removeChild(a);showToast('Backup exported ✓');}}
    function importData(file){if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const data=JSON.parse(e.target.result);const incoming=data.pt_logs||data.logs||[];if(!Array.isArray(incoming))throw new Error();const before=S.logs.length;const map=new Map(S.logs.map(l=>[l.date,l]));incoming.forEach(l=>{if(l?.date)map.set(l.date,l);});S.logs=normalizeLogs([...map.values()]);if(!S.settings.setupComplete&&data.pt_settings?.setupComplete){S.settings={cycleLength:clamp(data.pt_settings.cycleLength,21,45,28),periodLength:clamp(data.pt_settings.periodLength,2,10,5),setupComplete:true};}persist();renderAll();showToast(`Imported ${incoming.length} entries — ${S.logs.length-before} new ✓`);}catch(e){showToast('Import failed — invalid file');}};reader.readAsText(file);}

    /* ── Toast ── */
    let _tt;function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2800);}

    /* ── Theme ── */
    function applyTheme(t){S.theme=t==='dark'?'dark':'light';document.documentElement.setAttribute('data-theme',S.theme);document.querySelector('meta[name="theme-color"]').content=S.theme==='dark'?'#1a1010':'#fdf6f0';}
    function toggleTheme(){applyTheme(S.theme==='dark'?'light':'dark');persist();document.getElementById('themeToggle').innerHTML=`<i data-lucide="${S.theme==='dark'?'sun':'moon'}"></i>`;icons();}

    /* ── Helpers ── */
    function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
    function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    function symptomLabel(k){return(SYMPTOMS.find(s=>s[0]===k)||[k,cap(k.replace(/-/g,' '))])[1];}
    function moodLabel(k){return(MOODS.find(m=>m[0]===k)||[k,k])[1];}
    function icons(){if(window.lucide?.createIcons)window.lucide.createIcons();}

    /* ── Render: Home ── */
    function renderHome(){const pred=calcPredictions();const status=statusCopy(pred);const recent=[...S.logs].filter(l=>l.isPeriod||l.symptoms.length||l.mood||l.note).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);document.getElementById('view-home').innerHTML=`<div class="stack"><div><h1>Today</h1><div class="subtle">${fmtLong(isoToday())}</div></div><section class="card hero-card"><div class="subtle">${status.tag}</div><div class="status-line">${status.headline}</div><p class="muted" style="margin:0 0 var(--space-3);">${status.sub}</p><button class="primary-btn" id="quickLogBtn" type="button"><i data-lucide="droplets"></i> Log today</button></section><div class="two-col"><div class="stat"><div class="stat-label">Fertile window</div><div class="stat-value">${fmtShort(pred.fertileStart)}–${fmtShort(pred.fertileEnd)}</div></div><div class="stat"><div class="stat-label">Ovulation</div><div class="stat-value">${fmtShort(pred.ovuDay)}</div></div></div><section class="card"><h2>Upcoming</h2><div class="chip-row"><div class="chip fertile-chip active">🌿 ${fmtShort(pred.fertileStart)}–${fmtShort(pred.fertileEnd)}</div><div class="chip ovulation-chip active">🟣 Ovulation: ${fmtShort(pred.ovuDay)}</div></div></section><section class="card"><h2>Recent entries</h2>${recent.length?`<div class="mini-list">${recent.map(l=>`<button class="mini-item" data-open="${l.date}" type="button"><div><div><strong>${fmtShort(l.date)}</strong></div><div class="subtle">${[l.isPeriod?`Flow: ${cap(l.flow)}`:null,l.symptoms.length?l.symptoms.map(symptomLabel).join(', '):null,l.mood?moodLabel(l.mood):null].filter(Boolean).join(' · ')||'Daily log'}</div></div><i data-lucide="chevron-right"></i></button>`).join('')}</div>`:`<div class="empty-state"><svg class="empty-illustration" viewBox="0 0 160 120" fill="none" aria-hidden="true"><rect x="18" y="26" width="124" height="74" rx="20" fill="currentColor" opacity=".08"/>ircle cx="54" cy="63" r="10" fill="currentColor" opacity=".16"/><rect x="72" y="56" width="44" height="8" rx="4" fill="currentColor" opacity=".14"/><rect x="72" y="70" width="30" height="8" rx="4" fill="currentColor" opacity=".10"/></svg><div><strong>No entries yet</strong><br><span class="subtle">Start logging today.</span></div></div>`}</section></div>`;document.getElementById('quickLogBtn').onclick=quickLog;document.querySelectorAll('#view-home [data-open]').forEach(b=>b.onclick=()=>openSheet(b.dataset.open));}

    /* ── Render: Calendar ── */
    function renderCalendar(){const pred=calcPredictions();const pmap=buildPredMap(pred);const month=S.calMonth;const first=monthStart(month);const offset=(first.getDay()+6)%7;const gridStart=addDays(first,-offset);const today=isoToday();let cells='';for(let i=0;i<42;i++){const d=addDays(gridStart,i);const iso=toISO(d);const log=getLog(iso);const m=pmap.get(iso)||{};const outside=d.getMonth()!==month.getMonth();const cls=['day-cell',outside?'outside':'',iso===today?'today':'',log?.isPeriod?'logged-period':'',!log?.isPeriod&&m.predPeriod?'pred-period':'',!log?.isPeriod&&m.fertile?'fertile':''].filter(Boolean).join(' ');cells+=`<button class="${cls}" data-date="${iso}" type="button" aria-label="${fmtLong(iso)}">${d.getDate()}${m.ovulation?'<span class="ovulation-dot" aria-hidden="true"></span>':''}</button>`;}document.getElementById('view-calendar').innerHTML=`<div class="stack calendar-shell"><div><h1>Calendar</h1><div class="subtle">Tap a day to log or edit.</div></div><section class="card"><div class="calendar-header"><button class="icon-btn" id="prevM" aria-label="Previous month"><i data-lucide="chevron-left"></i></button><h2 class="month-title">${fmtMonthYear(month)}</h2><button class="icon-btn" id="nextM" aria-label="Next month"><i data-lucide="chevron-right"></i></button></div><div class="weekday-row" aria-hidden="true">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>`<div class="weekday">${d}</div>`).join('')}</div><div class="calendar-grid">${cells}</div></section><section class="card"><div class="legend"><div class="legend-item"><span class="legend-swatch swatch-period"></span>Logged period</div><div class="legend-item"><span class="legend-swatch swatch-pred"></span>Predicted period</div><div class="legend-item"><span class="legend-swatch swatch-fertile"></span>Fertile window</div><div class="legend-item"><span class="legend-swatch" style="position:relative;"><span class="legend-dot"></span></span>Ovulation</div><div class="legend-item"><span class="legend-swatch swatch-today"></span>Today</div></div></section></div>`;document.getElementById('prevM').onclick=()=>{S.calMonth=new Date(month.getFullYear(),month.getMonth()-1,1,12);renderCalendar();icons();};document.getElementById('nextM').onclick=()=>{S.calMonth=new Date(month.getFullYear(),month.getMonth()+1,1,12);renderCalendar();icons();};document.querySelectorAll('#view-calendar [data-date]').forEach(b=>b.onclick=()=>openSheet(b.dataset.date));}

    /* ── Render: Log ── */
    function logFormHTML(log,pfx){return`<section class="card"><h2>Period flow</h2><div class="select-row" id="${pfx}Flow">${['none','spotting','light','medium','heavy'].map(f=>`<button class="select-pill${log.flow===f?' active':''}" data-flow="${f}" type="button">${cap(f)}</button>`).join('')}</div></section><section class="card"><h2>Symptoms</h2><div class="symptom-grid" id="${pfx}Symp">${SYMPTOMS.map(([k,l])=>`<button class="chip${log.symptoms.includes(k)?' active':''}" data-sym="${k}" type="button">${l}</button>`).join('')}</div></section><section class="card"><h2>Mood</h2><div class="select-row" id="${pfx}Mood">${MOODS.map(([k,l])=>`<button class="select-pill${log.mood===k?' active':''}" data-mood="${k}" type="button">${l}</button>`).join('')}</div></section><section class="card"><h2>Energy</h2><div class="select-row" id="${pfx}Enrg">${ENERGIES.map(([k,l])=>`<button class="select-pill${log.energy===k?' active':''}" data-enrg="${k}" type="button">${l}</button>`).join('')}</div></section><section class="card"><div class="field">abel for="${pfx}Note">Notes</label><textarea id="${pfx}Note" maxlength="280" placeholder="Anything worth noting?">${esc(log.note||'')}</textarea><div class="subtle"><span id="${pfx}NC">${(log.note||'').length}</span>/280</div></div></section>`;}

    function bindLogForm(pfx,date,onSave){const cur=Object.assign({date,isPeriod:false,flow:'none',symptoms:[],mood:'',energy:'',note:''},getLog(date)||{});const sync=()=>{document.querySelectorAll(`#${pfx}Flow [data-flow]`).forEach(b=>b.classList.toggle('active',b.dataset.flow===cur.flow));document.querySelectorAll(`#${pfx}Symp [data-sym]`).forEach(b=>b.classList.toggle('active',cur.symptoms.includes(b.dataset.sym)));document.querySelectorAll(`#${pfx}Mood [data-mood]`).forEach(b=>b.classList.toggle('active',b.dataset.mood===cur.mood));document.querySelectorAll(`#${pfx}Enrg [data-enrg]`).forEach(b=>b.classList.toggle('active',b.dataset.enrg===cur.energy));};document.getElementById(`${pfx}Flow`)?.addEventListener('click',e=>{const b=e.target.closest('[data-flow]');if(!b)return;cur.flow=b.dataset.flow;cur.isPeriod=cur.flow!=='none';sync();});document.getElementById(`${pfx}Symp`)?.addEventListener('click',e=>{const b=e.target.closest('[data-sym]');if(!b)return;const k=b.dataset.sym;cur.symptoms=cur.symptoms.includes(k)?cur.symptoms.filter(s=>s!==k):[...cur.symptoms,k];sync();});document.getElementById(`${pfx}Mood`)?.addEventListener('click',e=>{const b=e.target.closest('[data-mood]');if(!b)return;cur.mood=cur.mood===b.dataset.mood?'':b.dataset.mood;sync();});document.getElementById(`${pfx}Enrg`)?.addEventListener('click',e=>{const b=e.target.closest('[data-enrg]');if(!b)return;cur.energy=cur.energy===b.dataset.enrg?'':b.dataset.enrg;sync();});const noteEl=document.getElementById(`${pfx}Note`);const nc=document.getElementById(`${pfx}NC`);noteEl?.addEventListener('input',()=>{cur.note=noteEl.value.slice(0,280);nc.textContent=cur.note.length;});document.getElementById(`${pfx}Save`)?.addEventListener('click',()=>{onSave(cur);});sync();}

    function renderLog(){const date=S.selectedDate||isoToday();const log=getLog(date)||{date,isPeriod:false,flow:'none',symptoms:[],mood:'',energy:'',note:''};document.getElementById('view-log').innerHTML=`<div class="stack"><div><h1>Log</h1><div class="subtle">Track flow, symptoms, mood, and energy.</div></div><section class="card"><div class="field">abel for="logDate">Date</label><input id="logDate" type="date" max="${isoToday()}" value="${date}" /></div></section><div id="logFormWrap">${logFormHTML(log,'lf')}</div><button class="primary-btn" id="lfSave" type="button"><i data-lucide="save"></i> Save</button></div>`;document.getElementById('logDate').addEventListener('change',e=>{S.selectedDate=e.target.value||isoToday();renderLog();icons();});bindLogForm('lf',date,cur=>saveLog(date,cur));}

    /* ── Render: Insights ── */
    function renderInsights(){const pred=calcPredictions();const sc={};S.logs.forEach(l=>l.symptoms.forEach(s=>sc[s]=(sc[s]||0)+1));const top5=Object.entries(sc).sort((a,b)=>b[1]-a[1]).slice(0,5);const mc={happy:0,neutral:0,sad:0,irritable:0,anxious:0};S.logs.forEach(l=>{if(l.mood&&mc[l.mood]!==undefined)mc[l.mood]++;});document.getElementById('view-insights').innerHTML=`<div class="stack"><div><h1>Insights</h1><div class="subtle">Patterns from your logs.</div></div><div class="two-col"><div class="stat"><div class="stat-label">Avg cycle</div><div class="stat-value">${pred.avgCycle} days</div></div><div class="stat"><div class="stat-label">Avg period</div><div class="stat-value">${pred.avgPeriod} days</div></div></div><section class="card"><h2>Regularity</h2><div style="font-size:var(--text-lg);font-weight:700;">${pred.regularity}</div><p class="muted" style="margin:var(--space-2) 0 0;font-size:var(--text-sm);">Based on ${pred.gaps.length} cycle gap${pred.gaps.length!==1?'s':''} recorded.</p></section><section class="card"><h2>Top symptoms</h2>${top5.length?`<div class="bar-list">${top5.map(([k,c])=>{const w=Math.max(6,Math.round((c/top5[0][1])*100));return`<div class="bar-row"><div class="bar-meta"><span>${symptomLabel(k)}</span><span>${c}</span></div><div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div></div>`;}).join('')}</div>`:`<div class="subtle">No symptom data yet.</div>`}</section><section class="card"><h2>Mood distribution</h2><div class="mood-grid">${MOODS.map(([k,l])=>`<div class="mood-box"><div class="mood-emoji">${l.split(' ')[0]}</div><div class="subtle" style="font-size:var(--text-xs);">${l.split(' ').slice(1).join(' ')}</div><div><strong>${mc[k]}</strong></div></div>`).join('')}</div></section><section class="card"><h2>Next predicted periods</h2><div class="mini-list">${pred.nextThree.map(d=>`<div class="mini-item"><div><strong>${fmtLong(d)}</strong><div class="subtle">Expected start</div></div><i data-lucide="sparkles"></i></div>`).join('')}</div></section></div>`;}

    /* ── Render: Partner ── */
    function renderPartner(){
      const pred = calcPredictions();
      const today = isoToday();
      const dToFertile = diffDays(today, pred.fertileStart);
      const dToOvu = diffDays(today, pred.ovuDay);
      const dToNext = diffDays(today, pred.nextStart);

      // Determine current action status
      let actionHTML = '';
      let phaseLabel = '';
      let phaseCls = '';

      if (pred.phase === 'period') {
        const daysLeft = diffDays(today, pred.currentPeriod.end);
        phaseLabel = '🩸 Period';
        phaseCls = 'phase-period';
        actionHTML = `
          <div class="action-card red">
            <h3>Period in progress</h3>
            <p>She's on her period. Ends in approximately <strong>${daysLeft + 1} day${daysLeft>0?'s':''}</strong>.</p>
            <p style="margin-top:var(--space-2);">This is a good time to be supportive — heat packs, snacks, patience. No action needed for conception right now.</p>
          </div>`;
      } else if (pred.phase === 'follicular' && dToFertile > 4) {
        phaseLabel = '🌱 Follicular';
        phaseCls = 'phase-follicular';
        actionHTML = `
          <div class="action-card blue">
            <h3>🧹 Clearance window</h3>
            <p>Fertile window opens in <strong>${dToFertile} days</strong> (${fmtShort(pred.fertileStart)}).</p>
            <p style="margin-top:var(--space-2);">Ejaculate <strong>2–4 days before the fertile window opens</strong> (around ${fmtShort(pred.clearanceDay)}) to flush out older, stale sperm from the epididymis. Fresh sperm after this point will have better motility and lower DNA fragmentation.</p>
          </div>`;
      } else if (pred.phase === 'follicular' && dToFertile <= 4 && dToFertile >= 0) {
        phaseLabel = '🌱 Pre-fertile';
        phaseCls = 'phase-follicular';
        actionHTML = `
          <div class="action-card green">
            <h3>🚀 Fertile window opening soon</h3>
            <p>Fertile window starts in <strong>${dToFertile === 0 ? 'today' : dToFertile + ' day' + (dToFertile>1?'s':'')}</strong>!</p>
            <p style="margin-top:var(--space-2);">If you haven't ejaculated in the last 1–2 days, do so once to clear old sperm. Then have intercourse <strong>every 1–2 days</strong> once the fertile window opens. Don't "save up" — abstinence over 4 days actually reduces sperm quality.</p>
          </div>`;
      } else if (pred.phase === 'fertile') {
        phaseLabel = '🌿 Fertile window';
        phaseCls = 'phase-fertile';
        const daysLeft = diffDays(today, pred.fertileEnd);
        actionHTML = `
          <div class="action-card green">
            <h3>✅ You're in the fertile window — act now</h3>
            <p>Fertile window has <strong>${daysLeft + 1} day${daysLeft>0?'s':''} left</strong>. Ovulation is predicted on <strong>${fmtWeekday(pred.ovuDay)}</strong>.</p>
            <p style="margin-top:var(--space-2);">Have intercourse <strong>every 1–2 days</strong> until and including ovulation day. Daily is fine. Sperm survive up to 5 days in cervical mucus, so starting now maximises coverage.</p>
          </div>`;
      } else if (pred.phase === 'ovulation') {
        phaseLabel = '🟣 Ovulation day';
        phaseCls = 'phase-ovulation';
        actionHTML = `
          <div class="action-card" style="background:var(--tint-ovulation-bg);border-color:var(--tint-ovulation-border);">
            <h3>🎯 Ovulation day — highest priority</h3>
            <p>Today is the <strong>predicted ovulation day</strong>. The egg survives only <strong>12–24 hours</strong>. This is the single most important day of the cycle.</p>
            <p style="margin-top:var(--space-2);">Have intercourse today if you haven't already in the last 24–48 hours. If you have, that coverage is good — sperm are already waiting.</p>
          </div>`;
      } else if (pred.phase === 'luteal') {
        phaseLabel = '🍂 Luteal phase';
        phaseCls = 'phase-luteal';
        actionHTML = `
          <div class="action-card amber">
            <h3>⏳ Post-ovulation — wait and see</h3>
            <p>Ovulation has passed. Next period expected in approximately <strong>${dToNext} days</strong> (${fmtShort(pred.nextStart)}).</p>
            <p style="margin-top:var(--space-2);">Nothing actionable right now for conception. If conception occurred, the egg has implanted. Avoid stress, and if your partner is tracking symptoms, check in with her.</p>
          </div>`;
      }

      // Conception plan timeline
      const timelineItems = [
        {
          dot:'🧹', cls: diffDays(today,pred.clearanceDay)===0?'today-dot':'',
          title:`Clear old sperm — around ${fmtShort(pred.clearanceDay)}`,
          sub:'Ejaculate 2–4 days before fertile window opens. Flushes the epididymis of older sperm with lower motility and higher DNA damage.'
        },
        {
          dot:'🌿', cls: pred.phase==='fertile'?'active-dot':'',
          title:`Fertile window — ${fmtShort(pred.fertileStart)} to ${fmtShort(pred.fertileEnd)}`,
          sub:'Have intercourse every 1–2 days throughout. Sperm survive up to 5 days in cervical mucus, so early starts pay off.'
        },
        {
          dot:'🎯', cls: pred.phase==='ovulation'?'today-dot':'',
          title:`Ovulation day — ${fmtShort(pred.ovuDay)}`,
          sub:'Most important day. Egg viable for 12–24 hours only. Have intercourse on or within 1 day before this date.'
        },
        {
          dot:'⏳', cls:'',
          title:`Two-week wait — until ${fmtShort(pred.nextStart)}`,
          sub:'Wait to see if the period comes. Avoid pregnancy tests before 12–14 days post-ovulation to prevent false negatives.'
        }
      ];

      document.getElementById('view-partner').innerHTML = `
        <div class="stack">
          <div>
            <h1>Partner</h1>
            <div class="subtle">Conception guide based on her cycle.</div>
          </div>

          <section class="card partner-hero">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3);">
              <div class="subtle">Current phase</div>
              <span class="phase-badge ${phaseCls}">${phaseLabel}</span>
            </div>
            <div class="two-col">
              <div class="stat"><div class="stat-label">Fertile window</div><div class="stat-value" style="font-size:var(--text-base);">${fmtShort(pred.fertileStart)}–${fmtShort(pred.fertileEnd)}</div></div>
              <div class="stat"><div class="stat-label">Ovulation</div><div class="stat-value" style="font-size:var(--text-base);">${fmtShort(pred.ovuDay)}</div></div>
            </div>
          </section>

          <section>${actionHTML}</section>

          <section class="card">
            <h2>📋 Conception plan for this cycle</h2>
            <div class="timeline">
              ${timelineItems.map(item=>`
                <div class="timeline-item">
                  <div class="timeline-dot ${item.cls}">${item.dot}</div>
                  <div class="timeline-content">
                    <div class="timeline-title">${item.title}</div>
                    <div class="timeline-sub">${item.sub}</div>
                  </div>
                </div>`).join('')}
            </div>
          </section>

          <section class="card">
            <h2>🔬 What the research says</h2>
            <div class="stack" style="gap:var(--space-3);">
              <div class="action-card blue">
                <h3>Don't "save up" sperm</h3>
                <p>Extended abstinence (≥4 days) <strong>increases sperm count but reduces motility and raises DNA fragmentation</strong>. Fresher sperm from 1–2 day intervals outperform "saved" sperm in pregnancy outcomes.</p>
                <p style="margin-top:var(--space-2);"><span class="research-note">Source: PMC12968876, Feb 2026 literature review; Fertil Steril 2010 IUI study</span></p>
              </div>
              <div class="action-card green">
                <h3>Every 1–2 days during the fertile window</h3>
                <p>ASRM 2022 guidelines: intercourse every 1–2 days during the fertile window gives the highest conception rate. <strong>Daily intercourse is equally effective and not harmful.</strong></p>
                <p style="margin-top:var(--space-2);"><span class="research-note">Source: ASRM Committee Opinion 2022; Cochrane Review 2023</span></p>
              </div>
              <div class="action-card amber">
                <h3>Use ovulation prediction kits (OPKs)</h3>
                <p>Urine LH-surge tests raise the pregnancy rate from ~18% to <strong>20–28% per cycle</strong> by confirming ovulation timing more precisely than calendar estimates alone.</p>
                <p style="margin-top:var(--space-2);"><span class="research-note">Source: Cochrane Review 2023 — timed intercourse with urinary OPK</span></p>
              </div>
              <div class="action-card blue">
                <h3>Sperm survive up to 5 days</h3>
                <p>In fertile-quality cervical mucus, sperm can remain viable for up to 5 days. Starting intercourse <strong>5 days before predicted ovulation</strong> means there's sperm waiting when the egg arrives.</p>
                <p style="margin-top:var(--space-2);"><span class="research-note">Source: Wilcox et al., NEJM 1995 (landmark fertile window study)</span></p>
              </div>
            </div>
          </section>

          <section class="card">
            <h2>💡 Understanding her cycle phases</h2>
            <div class="stack" style="gap:var(--space-3);">
              <div class="mini-item" style="border-radius:var(--radius-md);align-items:flex-start;"><div style="flex:0 0 36px;font-size:22px;">🩸</div><div><div class="timeline-title">Period (Days 1–${pred.avgPeriod})</div><div class="timeline-sub">Uterine lining sheds. She may have cramps, fatigue, bloating. Be extra supportive. Heat, rest, and patience help more than you think.</div></div></div>
              <div class="mini-item" style="border-radius:var(--radius-md);align-items:flex-start;"><div style="flex:0 0 36px;font-size:22px;">🌱</div><div><div class="timeline-title">Follicular phase (Days ${pred.avgPeriod + 1}–${pred.avgCycle - 16})</div><div class="timeline-sub">Estrogen rises. Energy improves. She often feels more social and positive. Good time for shared activities and connection.</div></div></div>
              <div class="mini-item" style="border-radius:var(--radius-md);align-items:flex-start;"><div style="flex:0 0 36px;font-size:22px;">🌿</div><div><div class="timeline-title">Fertile window (Days ${pred.avgCycle - 18}–${pred.avgCycle - 11})</div><div class="timeline-sub">LH surges, ovulation approaches. Cervical mucus becomes clear and stretchy ("egg-white"). Libido often naturally increases.</div></div></div>
              <div class="mini-item" style="border-radius:var(--radius-md);align-items:flex-start;"><div style="flex:0 0 36px;font-size:22px;">🟣</div><div><div class="timeline-title">Ovulation (Day ~${pred.avgCycle - 14})</div><div class="timeline-sub">Egg released. Window is 12–24 hours. Some women feel mild one-sided pelvic pain (Mittelschmerz). Most fertile moment of the cycle.</div></div></div>
              <div class="mini-item" style="border-radius:var(--radius-md);align-items:flex-start;"><div style="flex:0 0 36px;font-size:22px;">🍂</div><div><div class="timeline-title">Luteal phase (Days ${pred.avgCycle - 13}–${pred.avgCycle})</div><div class="timeline-sub">Progesterone dominates. PMS symptoms may appear: mood shifts, bloating, tender breasts, fatigue. Emotional support matters most here. Her feelings are hormonally driven, not personal.</div></div></div>
            </div>
          </section>

          <p class="subtle" style="text-align:center;font-size:var(--text-xs);line-height:1.6;">
            ⚠️ These predictions are based on calendar averages and are estimates only. Confirm ovulation timing with LH test strips (OPK) for better accuracy. Consult a doctor if you've been trying for 12+ months (or 6+ months if over 35).
          </p>
        </div>`;
    }

    /* ── Render: Settings ── */
    function renderSettings(){const logCount=S.logs.length;const pCount=getPeriods().length;document.getElementById('view-settings').innerHTML=`<div class="stack"><div><h1>Settings</h1><div class="subtle">Backup, restore, and manage your data.</div></div><section class="card" style="border-left:3px solid var(--color-primary);"><h2>⚠️ Safari data warning</h2><p class="muted" style="margin:0;font-size:var(--text-sm);line-height:1.6;">Safari on iPhone can <strong>silently erase localStorage</strong> after 7 days of inactivity. Export a backup regularly and save it to iCloud Drive or Files.</p></section><div class="settings-section"><div class="settings-label">Data backup</div><div class="settings-row"><div><div class="settings-row-label">Export backup</div><div class="settings-row-sub">${logCount} log${logCount!==1?'s':''} · ${pCount} period${pCount!==1?'s':''}</div></div><button class="settings-action-btn success-btn" id="exportBtn" type="button"><i data-lucide="download"></i> Export .json</button></div><div class="settings-row"><div><div class="settings-row-label">Import backup</div><div class="settings-row-sub">Merges with existing — nothing deleted</div></div><button class="settings-action-btn secondary-btn" id="importBtn" type="button"><i data-lucide="upload"></i> Import .json</button></div></div><div class="settings-section"><div class="settings-label">Appearance</div><div class="settings-row"><div><div class="settings-row-label">Dark mode</div><div class="settings-row-sub">${S.theme==='dark'?'On':'Off'}</div></div><button class="settings-action-btn secondary-btn" id="themeBtn2" type="button"><i data-lucide="${S.theme==='dark'?'sun':'moon'}"></i> Toggle</button></div></div><div class="settings-section"><div class="settings-label">Cycle defaults</div><div class="settings-row"><div><div class="settings-row-label">Cycle length</div><div class="settings-row-sub">Used before 2 cycles are logged</div></div><strong>${S.settings.cycleLength} days</strong></div><div class="settings-row"><div><div class="settings-row-label">Period length</div><div class="settings-row-sub">Default period duration</div></div><strong>${S.settings.periodLength} days</strong></div></div><div class="settings-section"><div class="settings-label">Danger zone</div><button class="danger-btn" id="wipeBtn" type="button"><i data-lucide="trash-2"></i> Erase all data</button></div><p class="subtle" style="text-align:center;font-size:var(--text-xs);">All data is stored locally on this device only. No account, no server, no tracking.</p></div>`;document.getElementById('exportBtn').onclick=exportData;document.getElementById('importBtn').onclick=()=>document.getElementById('importInput').click();document.getElementById('themeBtn2').onclick=()=>{toggleTheme();renderSettings();icons();};document.getElementById('wipeBtn').onclick=()=>{if(!confirm('Permanently delete ALL logs and settings?'))return;localStorage.removeItem(KEYS.logs);localStorage.removeItem(KEYS.settings);S.logs=[];S.settings={cycleLength:28,periodLength:5,setupComplete:false};persist();setupOnboarding();};}

    /* ── Day sheet ── */
    function openSheet(date){const log=getLog(date)||{date,isPeriod:false,flow:'none',symptoms:[],mood:'',energy:'',note:''};document.getElementById('sheetTitle').textContent=fmtLong(date);document.getElementById('sheetBody').innerHTML=`<p class="subtle" style="margin:0;">Tap fields to log for this day.</p>${logFormHTML(log,'sf')}<button class="primary-btn" id="sfSave" type="button"><i data-lucide="save"></i> Save day</button>`;document.getElementById('sheetBackdrop').classList.add('open');document.getElementById('daySheet').classList.add('open');bindLogForm('sf',date,cur=>{saveLog(date,cur);closeSheet();});icons();}
    function closeSheet(){document.getElementById('sheetBackdrop').classList.remove('open');document.getElementById('daySheet').classList.remove('open');}

    /* ── Tabs ── */
    function setTab(tab){S.tab=tab;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${tab}`));document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}
    function renderAll(){renderHome();renderCalendar();renderLog();renderInsights();renderPartner();renderSettings();icons();}

    /* ── Onboarding ── */
    function setupOnboarding(){const ob=document.getElementById('onboarding');const app=document.getElementById('appRoot');if(S.settings.setupComplete){ob.classList.add('hidden');app.classList.remove('hidden');return;}ob.classList.remove('hidden');app.classList.add('hidden');S.wizStep=1;const wizProg=document.getElementById('wizProg');const wizStepLabel=document.getElementById('wizStepLabel');const wizTitle=document.getElementById('wizTitle');const wizDesc=document.getElementById('wizDesc');const wizBack=document.getElementById('wizBack');const wizNext=document.getElementById('wizNext');const steps=[document.getElementById('wizS1'),document.getElementById('wizS2'),document.getElementById('wizS3')];const wizDate=document.getElementById('wizDate');const wizCycle=document.getElementById('wizCycle');const wizPeriod=document.getElementById('wizPeriod');const wizCycleVal=document.getElementById('wizCycleVal');const wizPeriodVal=document.getElementById('wizPeriodVal');wizDate.max=isoToday();wizDate.value=toISO(addDays(new Date(),-28));wizCycle.oninput=()=>wizCycleVal.textContent=wizCycle.value;wizPeriod.oninput=()=>wizPeriodVal.textContent=wizPeriod.value;const COPY=[['When did your last period start?','We\'ll use this to show your current cycle.'],['How long is your typical cycle?','Days from one period start to the next.'],['How long does your period usually last?','Helps predict your upcoming window.']];function draw(){steps.forEach((s,i)=>s.classList.toggle('hidden',i!==S.wizStep-1));wizStepLabel.textContent=`Step ${S.wizStep} of 3`;wizProg.style.width=`${(S.wizStep/3)*100}%`;wizBack.classList.toggle('hidden',S.wizStep===1);wizNext.textContent=S.wizStep===3?'Finish':'Continue';[wizTitle.textContent,wizDesc.textContent]=COPY[S.wizStep-1];}wizBack.onclick=()=>{if(S.wizStep>1){S.wizStep--;draw();}};wizNext.onclick=()=>{if(S.wizStep===1&&!wizDate.value)return;if(S.wizStep<3){S.wizStep++;draw();return;}S.settings={cycleLength:clamp(wizCycle.value,21,45,28),periodLength:clamp(wizPeriod.value,2,10,5),setupComplete:true};const start=wizDate.value;for(let i=0;i<S.settings.periodLength;i++){const d=toISO(addDays(start,i));S.logs=S.logs.filter(l=>l.date!==d);S.logs.push({date:d,isPeriod:true,flow:i===0?'medium':'light',symptoms:[],mood:'',energy:'',note:''});}S.logs=normalizeLogs(S.logs);persist();setupOnboarding();renderAll();};draw();}

    /* ── Events ── */
    function wireEvents(){document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.getElementById('themeToggle').onclick=toggleTheme;document.getElementById('sheetBackdrop').onclick=closeSheet;document.getElementById('sheetClose').onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});document.getElementById('importInput').addEventListener('change',e=>{importData(e.target.files[0]);e.target.value='';});}

    /* ── Boot ── */
    function init(){loadState();applyTheme(S.theme);wireEvents();setupOnboarding();if(S.settings.setupComplete){document.getElementById('appRoot').classList.remove('hidden');renderAll();setTab('home');}icons();}
    init();
  })();
  </script>
</body>
</html>
